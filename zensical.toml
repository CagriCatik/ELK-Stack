[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "navigation.tracking",
  "navigation.path",
  "navigation.indexes",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.code.copy"
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "deep purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.plugins.offline]
