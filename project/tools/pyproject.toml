[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-insight-lab"
version = "0.1.0"
description = "Synthetic XML execution report generator, uploader, reconciler, provisioner, and verifier for XML Insight Lab."
requires-python = ">=3.11"
dependencies = [
  "lxml==5.3.0",
  "requests==2.32.3",
  "PyYAML==6.0.2",
]

[project.scripts]
xml-insight = "xml_insight_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
